
version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: finance-tracker-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: finance_tracker
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./scripts/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - finance-tracker-network

  finance-tracker:
    build: .
    container_name: finance-tracker-app
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://admin:admin123@mongodb:27017/finance_tracker?authSource=admin
      - JWT_SECRET=finance-tracker-production-secret-change-this
      - PORT=3000
    ports:
      - "3000:3000"
    networks:
      - finance-tracker-network
    volumes:
      - ./logs:/app/logs

volumes:
  mongodb_data:

networks:
  finance-tracker-network:
    driver: bridge
